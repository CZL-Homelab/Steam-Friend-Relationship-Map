<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Background Rounded Rect -->
  <rect width="62" height="62" x="1" y="1" rx="14" fill="#1b2838" stroke="#316282" stroke-width="2"/>
  
  <!-- Connections (Edges) -->
  <line x1="32" y1="32" x2="18" y2="20" stroke="#8f98a0" stroke-width="2" opacity="0.6" stroke-dasharray="1 1"/>
  <line x1="32" y1="32" x2="48" y2="24" stroke="#8f98a0" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="32" x2="36" y2="48" stroke="#8f98a0" stroke-width="2" opacity="0.6"/>
  
  <!-- Outer Nodes -->
  <circle cx="18" cy="20" r="5.5" fill="#1078ff" stroke="#171a21" stroke-width="1"/>
  <circle cx="48" cy="24" r="6.5" fill="#ece100" stroke="#171a21" stroke-width="1"/>
  <circle cx="36" cy="48" r="5.5" fill="#cd5c5c" stroke="#171a21" stroke-width="1"/>
  
  <!-- Center Node (Root) -->
  <circle cx="32" cy="32" r="8.5" fill="#66c0f4" stroke="#171a21" stroke-width="1.5"/>
</svg>
