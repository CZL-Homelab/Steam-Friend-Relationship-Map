<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <style>
    /* Default Dark Scheme (Steam classic colors) */
    .bg-rect {
      fill: #1b2838;
      stroke: #316282;
      transition: fill 0.3s, stroke 0.3s;
    }
    .center-node {
      fill: #66c0f4;
      stroke: #171a21;
      transition: fill 0.3s, stroke 0.3s;
    }
    .edge-line {
      stroke: #8f98a0;
      transition: stroke 0.3s;
    }
    .node-stroke {
      stroke: #171a21;
      transition: stroke 0.3s;
    }

    /* Light Scheme auto-adapted for Browser Tabs Bar */
    @media (prefers-color-scheme: light) {
      .bg-rect {
        fill: #f4f5f7;
        stroke: #c2cbd4;
      }
      .center-node {
        fill: #00b4d8;
        stroke: #ffffff;
      }
      .node-stroke {
        stroke: #ffffff;
      }
      .edge-line {
        stroke: #7e8c9c;
      }
    }
  </style>
  
  <!-- Background Rounded Rect -->
  <rect class="bg-rect" width="62" height="62" x="1" y="1" rx="14" stroke-width="2"/>
  
  <!-- Connections (Edges) -->
  <line class="edge-line" x1="32" y1="32" x2="18" y2="20" stroke-width="2" opacity="0.6" stroke-dasharray="1 1"/>
  <line class="edge-line" x1="32" y1="32" x2="48" y2="24" stroke-width="2" opacity="0.6"/>
  <line class="edge-line" x1="32" y1="32" x2="36" y2="48" stroke-width="2" opacity="0.6"/>
  
  <!-- Outer Nodes -->
  <circle class="node-stroke" cx="18" cy="20" r="5.5" fill="#1078ff" stroke-width="1"/>
  <circle class="node-stroke" cx="48" cy="24" r="6.5" fill="#ece100" stroke-width="1"/>
  <circle class="node-stroke" cx="36" cy="48" r="5.5" fill="#cd5c5c" stroke-width="1"/>
  
  <!-- Center Node (Root) -->
  <circle class="center-node" cx="32" cy="32" r="8.5" stroke-width="1.5"/>
</svg>
