[project]
name = "steam-friend-relationship-map"
version = "0.1.0"
description = "Local-first, privacy-conscious social graph analysis with Steam and Kuzu/Neo4j"
readme = "README.md"
authors = [
    { name = "LYKK231" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx[socks]>=0.28.1",
    "keyring>=25.7.0",
    "kuzu>=0.11.3",
    "neo4j>=6.2.0",
    "networkx>=3.6.1,<4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.12,<2",
    "uvicorn>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/CZL-Homelab/Steam-Friend-Relationship-Map"
Repository = "https://github.com/CZL-Homelab/Steam-Friend-Relationship-Map"
Issues = "https://github.com/CZL-Homelab/Steam-Friend-Relationship-Map/issues"
Releases = "https://github.com/CZL-Homelab/Steam-Friend-Relationship-Map/releases"

[project.scripts]
steam-friend-map = "steam_friend_relationship_map.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff==0.12.0",
]
